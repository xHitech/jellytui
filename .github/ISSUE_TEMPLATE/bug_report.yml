name: Bug Report
description: Report a problem or unexpected behavior in jellytui
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Precise steps to reproduce the behavior.
      placeholder: |
        1. Run 'jellytui'
        2. Navigate to '...'
        3. Press key '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
      placeholder: Expected ... but instead ...
    validations:
      required: true

  - type: input
    id: jellytui-version
    attributes:
      label: jellytui Version
      description: Run `jellytui --check` or check your installed package version.
      placeholder: "e.g., 0.1.1 or git commit hash"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python3 --version`.
      placeholder: "e.g., Python 3.11.9, Python 3.12.4"
    validations:
      required: true

  - type: input
    id: terminal-env
    attributes:
      label: Terminal Emulator & $TERM
      description: What terminal emulator and $TERM setting are you using?
      placeholder: "e.g., Kitty / xterm-kitty, Alacritty / alacritty, tmux"
    validations:
      required: true

  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin Server Version
      description: The version of your Jellyfin media server.
      placeholder: "e.g., 10.9.11"
    validations:
      required: false

  - type: input
    id: mpv-version
    attributes:
      label: mpv Version
      description: Output of `mpv --version`.
      placeholder: "e.g., mpv 0.38.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics and Logs
      description: Paste any terminal output, traceback, or the output of `jellytui --check` / `jellytui --check-play`.
      render: shell
      placeholder: |
        $ jellytui --check
        ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs relevant to the issue.
    validations:
      required: false
